<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Al Business Self-Healing Multi-Agent</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #09151d;
        color: #edf7ff;
        padding: 32px;
      }
      .container {
        max-width: 980px;
        margin: 0 auto;
      }
      textarea {
        width: 100%;
        min-height: 140px;
        background: #0d1d2b;
        color: #edf7ff;
        border: 1px solid #2d4358;
        border-radius: 12px;
        padding: 16px;
        font-size: 16px;
      }
      .action-row {
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }
      button {
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #67e8f9, #38bdf8);
        color: #07141d;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
      }
      .log-panel {
        margin-top: 24px;
        background: #0d1d2b;
        border: 1px solid #2d4358;
        border-radius: 12px;
        padding: 16px;
      }
      .log-item {
        border-bottom: 1px solid #1d2d3a;
        padding: 10px 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Al Business Self-Healing Multi-Agent</h1>

      <textarea id="taskInput">
Alibaba tarzı e-ticaret platformu qur: FastAPI backend, məhsul və istifadəçi cədvəlləri, Dockerfile, docker-compose.yml və deploy planı.
      </textarea>

      <div class="action-row">
        <button id="runBtn">Agentləri Başlat</button>
        <button id="selfHealBtn" class="secondary">Özünü Bərpa Et</button>
      </div>

      <div id="logPanel" class="log-panel"></div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
